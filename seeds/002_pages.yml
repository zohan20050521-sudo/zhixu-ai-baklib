pages:
  name: "知序 AI"
  slug: "index"
  template_name: "index"
  template_style: "mobile-app"
  settings:
    hero_eyebrow: "团队知识助手 · 全新上线"
    hero_title: "把散落的知识，变成随时可用的答案。"
    hero_description: "连接团队文档、项目资料与业务系统。知序 AI 理解上下文、保留引用来源，让每个人都能快速找到可信答案。"
    primary_action_label: "体验产品演示"
    secondary_action_label: "了解产品能力"
    features_eyebrow: "核心能力"
    features_title: "不是多一个搜索框，而是多一位懂业务的同事"
    features_description: "从知识接入到答案生成，每一步都围绕准确、可信与可持续运营设计。"
    faq_question_1: "现有文档需要重新搬进知序 AI 吗？"
    faq_answer_1: "不需要。知序 AI 通过连接器读取并同步现有知识，原始内容仍保留在团队正在使用的平台中。"
    faq_question_2: "AI 会不会看到员工无权访问的内容？"
    faq_answer_2: "不会。检索前会校验当前用户权限，答案只使用该用户有权访问的知识，并保留访问记录。"
    faq_question_3: "回答不准确时，团队可以怎样改进？"
    faq_answer_3: "运营人员可以查看答案来源、用户反馈与无答案问题，修订原文或补充知识后，系统会自动更新索引。"
    faq_question_4: "适合从哪个场景开始试用？"
    faq_answer_4: "建议选择资料相对集中、重复咨询较多的场景，例如客服政策、员工入职或项目交付规范，更容易快速验证价值。"
    cta_title: "让团队的下一次提问，从答案开始。"
    cta_description: "从一个真实场景开始，体验知识被连接、理解和复用的完整过程。"
  children:
    - name: "产品能力"
      slug: "product"
      template_name: "channel"
      template_style: "list"
      settings:
        title: "产品能力"
        description: "了解知序 AI 如何连接、理解和交付团队知识。"
        thumb_image_url: "images/demo/book-600x400.png"
      children:
        - name: "智能检索与问答"
          slug: "knowledge-search"
          template_name: "page"
          template_style: "side"
          settings:
            title: "智能检索与问答"
            description: "理解业务语境，生成附带原文引用的可信答案。"
            thumb_image_url: "images/demo/10-800x600.png"
            content: |
              <p>知序 AI 结合关键词、语义与权限信息检索团队知识，并根据当前问题生成结构清晰的回答。</p>
              <p>每条重要结论都会保留引用位置、文档版本与更新时间，用户可以随时返回原文核对。</p>
        - name: "知识源连接与同步"
          slug: "connectors"
          template_name: "page"
          template_style: "side"
          settings:
            title: "知识源连接与同步"
            description: "连接团队现有内容，不改变原本的协作方式。"
            thumb_image_url: "images/demo/building-600x400.png"
            content: |
              <p>通过连接器接入文档、网页、表格与项目资料，保留目录结构并按变化持续增量同步。</p>
              <p>团队无需重复搬运内容，可以从一个空间或一类高频问题开始逐步验证。</p>
        - name: "权限与内容治理"
          slug: "security"
          template_name: "page"
          template_style: "side"
          settings:
            title: "权限与内容治理"
            description: "让知识高效流动，同时保持清晰的访问边界。"
            thumb_image_url: "images/demo/product-400x600.png"
            content: |
              <p>知序 AI 沿用原系统的成员与空间权限，检索前会校验当前用户身份，避免答案越界。</p>
              <p>内容运营人员还可以发现重复、过期与缺失知识，并通过反馈持续改进答案质量。</p>

    - name: "使用场景"
      slug: "scenes"
      template_name: "channel"
      template_style: "list"
      settings:
        title: "使用场景"
        description: "从重复咨询到复杂项目，在关键工作节点直接获得答案。"
        thumb_image_url: "images/demo/project_1.jpg"
      children:
        - name: "客户支持知识助手"
          slug: "customer-support"
          template_name: "page"
          settings:
            title: "客户支持知识助手"
            description: "统一产品、服务与政策口径，减少重复回答。"
            thumb_image_url: "images/demo/project_2.jpg"
            content: |
              <p>聚合产品手册、服务规范与历史问答，为客服提供即时、可追溯的答案。</p>
              <p>通过高频问题与无答案问题分析，团队可以持续发现内容缺口并完善知识库。</p>
        - name: "员工入职向导"
          slug: "onboarding"
          template_name: "page"
          settings:
            title: "员工入职向导"
            description: "让每位新人都有一位随时在线的团队向导。"
            thumb_image_url: "images/demo/1-800x600.png"
            content: |
              <p>按岗位聚合制度、工具、流程与学习任务，在新人执行真实工作时提供及时答疑。</p>
              <p>统一不同部门的入职体验，也减少行政人员与业务导师被重复问题打断。</p>
        - name: "项目协作与复盘"
          slug: "project-review"
          template_name: "page"
          settings:
            title: "项目协作与复盘"
            description: "快速还原项目背景、关键决策与交付经验。"
            thumb_image_url: "images/demo/project_3.jpg"
            content: |
              <p>关联需求、会议纪要、决策记录与交付资料，帮助成员理解项目为什么做出某项选择。</p>
              <p>项目结束后，知序 AI 可以辅助整理复盘材料，让经验更容易被后续团队复用。</p>

    - name: "帮助中心"
      slug: "guides"
      template_name: "channel"
      template_style: "list"
      settings:
        title: "帮助中心"
        description: "快速完成首个知识空间的连接、配置与验证。"
        thumb_image_url: "images/demo/10.png"
      children:
        - name: "开始使用知序 AI"
          slug: "getting-started"
          template_name: "page"
          settings:
            title: "开始使用知序 AI"
            description: "从创建空间到完成第一次可信问答。"
            content: |
              <p>选择一个资料相对集中且重复咨询较多的场景，创建知识空间并连接对应资料。</p>
              <p>同步完成后，用团队真实问题验证答案与引用，再邀请少量成员参与反馈。</p>
        - name: "配置知识源"
          slug: "configure-source"
          template_name: "page"
          settings:
            title: "配置知识源"
            description: "管理同步范围、更新频率与内容状态。"
            content: |
              <p>管理员可以选择需要同步的目录或空间，并在连接器详情中查看同步状态与异常记录。</p>
        - name: "管理成员权限"
          slug: "manage-access"
          template_name: "page"
          settings:
            title: "管理成员权限"
            description: "确认成员只访问被授权的知识。"
            content: |
              <p>知序 AI 会同步原知识源的访问关系。管理员也可以在空间设置中查看成员与权限范围。</p>

    - name: "产品动态"
      slug: "updates"
      template_name: "channel"
      template_style: "list"
      settings:
        title: "产品动态"
        description: "记录知序 AI 的产品更新与知识管理实践。"
        thumb_image_url: "images/demo/10-600x800.png"
      children:
        - name: "知序 AI 团队知识助手发布"
          slug: "launch"
          template_name: "page"
          settings:
            title: "知序 AI 团队知识助手发布"
            description: "让散落的团队知识成为随时可用、可验证的答案。"
            content: |
              <p>首个版本聚焦多源知识连接、语义检索、答案引用与权限同步，帮助团队从高频问题开始验证 AI 知识助手。</p>
        - name: "如何选择首个 AI 知识场景"
          slug: "first-use-case"
          template_name: "page"
          settings:
            title: "如何选择首个 AI 知识场景"
            description: "用四个标准判断哪个场景最适合率先落地。"
            content: |
              <p>优先选择资料相对集中、问题重复度高、答案口径明确且有真实使用者的场景，更容易获得可衡量的反馈。</p>

    - name: "关于知序"
      slug: "about"
      template_name: "page"
      template_style: "side"
      settings:
        title: "关于知序"
        description: "我们相信，团队知识只有被找到、被理解、被验证时才真正产生价值。"
        thumb_image_url: "images/demo/bg-planet.jpg"
        content: |
          <p>知序 AI 是一款面向团队的知识助手，目标是让散落在文档、项目和业务系统中的信息，成为每个人随时可用的答案。</p>
          <p>产品坚持权限清晰、来源透明与持续治理三项原则，让 AI 带来的效率建立在可信基础上。</p>
