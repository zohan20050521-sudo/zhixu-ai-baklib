      8年|企业官网与 CMS 实施经验
      500+|品牌站点与内容门户交付
      12+|开箱即用的首页主题变体
      48h|典型双语站点上线周期
    slider_one_title: "以内容与体验 <span class='text-yellow-300'>驱动企业增长</span>"
    slider_one_url: "/services"
    slider_one_image_url: "images/demo/bg-hero.jpg"
    slider_two_title: "Baklib CMS 门户，<span class='text-yellow-300'>两周上线品牌官网</span>"
    slider_two_url: "/portfolio"
    slider_two_image_url: "images/demo/building-600x400.png"
    section_image_url: "images/demo/bg-planet.jpg"
    html_content: |
      <div class="grid gap-6 md:grid-cols-2">
        <div class="p-6 rounded-2xl shadow-lg bg-white/70">
          <h3 class="text-xl font-semibold text-primary-700">CMS 一体化内容运营</h3>
          <p class="mt-2 text-slate-600">从信息架构、视觉系统到栏目与多主题首页，WWW 模板帮助团队快速搭建可维护的企业官网与推广站点。</p>
        </div>
        <div class="p-6 rounded-2xl shadow-lg bg-white/70">
          <h3 class="text-xl font-semibold text-primary-700">多行业可复制实践</h3>
          <p class="mt-2 text-slate-600">覆盖 B2B 科技、制造、金融与企业服务场景，复用案例库、新闻资讯与视频中心组件，降低改版成本。</p>
        </div>
      </div>
  children:
    - name: "关于我们"
      slug: "about"
      template_name: "channel"
      template_style: "side"
      settings:
        title: "关于我们"
        description: "了解 WWW 模板的定位、实施方式与 Baklib CMS 能力。"
        thumb_image_url: "images/demo/bg-planet.jpg"
      children:
        - name: "企业故事"
          slug: "company"
          template_name: "page"
          template_style: "side"
          settings:
            title: "企业故事"
            description: "面向企业品牌官网与 CMS 门户的一站式模板实践。"
            thumb_image_url: "images/demo/building-600x400.png"
            content: |
              <p>WWW 模板凝聚 Baklib 在企业官网、内容门户与营销推广项目中的最佳实践，帮助团队在短周期内完成站点结构、视觉与栏目配置。</p>
              <p>建议在本页补充公司里程碑、服务区域与核心客户类型，建立访客信任并承接后续咨询转化。</p>
        - name: "专业团队"
          slug: "team"
          template_name: "page"
          template_style: "side"
          settings:
            title: "专业团队"
            description: "策略、设计、工程与内容运营协同交付企业门户项目。"
            thumb_image_url: "images/demo/product-400x600.png"
            content: |
              <p>典型项目组包含品牌策略、体验设计、前端工程与内容运营角色，按周迭代交付原型、视觉稿与可上线页面。</p>
              <p>可在此展示团队分工、资质认证或交付流程图，便于潜在客户评估合作方式。</p>
        - name: "加入我们"
          slug: "career"
          template_name: "page"
          template_style: "side"
          settings:
            title: "加入我们"
            description: "探索与 Baklib 生态相关的合作、顾问与实施岗位。"
            thumb_image_url: "images/demo/1-600x800.png"
            content: |
              <p>欢迎体验设计师、内容策划与前端工程师参与主题共建与客户项目实施，共同打造下一代企业内容体验。</p>
              <p>可将本页替换为最新招聘或合作伙伴计划，并引导访客提交表单或订阅动态。</p>

